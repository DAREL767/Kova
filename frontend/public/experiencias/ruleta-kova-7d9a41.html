<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#111111">
<title>Ruleta de premios KOVA</title>
<style>
:root{--cream:#d9d4c8;--ink:#171717;--olive:#555b45}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#343434,#111 70%);color:#f7f4ed;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,720px);text-align:center}
.brand{letter-spacing:.28em;font-weight:800;font-size:clamp(28px,7vw,48px);color:var(--cream);margin:0}
.subtitle{color:#d5d0c5;margin:8px 0 22px;letter-spacing:.08em}
.wheel-wrap{position:relative;width:min(82vw,490px);aspect-ratio:1;margin:0 auto 22px;filter:drop-shadow(0 12px 24px #0009)}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid var(--cream);z-index:2;filter:drop-shadow(0 2px 2px #000)}
button{border:0;border-radius:999px;background:var(--cream);color:#171717;font-weight:800;letter-spacing:.08em;padding:16px 34px;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #8c867a;transition:transform .15s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8c867a}
button:disabled{opacity:.6;cursor:wait}
.note{font-size:12px;color:#aaa69d;max-width:520px;margin:20px auto 0;line-height:1.5}
.result{display:none;margin:18px auto 0;padding:18px;border:1px solid #777064;border-radius:16px;background:#222;max-width:480px}
.result strong{display:block;color:var(--cream);font-size:22px;margin-bottom:6px}
.result.show{display:block}
</style>
</head>
<body>
<main>
  <h1 class="brand">KOVA</h1>
  <p class="subtitle">GIRA Y DESCUBRE TU PREMIO</p>
  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="900" height="900" aria-label="Ruleta de premios"></canvas>
  </div>
  <button id="spin" type="button">GIRAR RULETA</button>
  <section class="result" id="result" aria-live="polite">
    <strong id="prize"></strong>
    <span>¡Gracias por participar en KOVA!</span>
  </section>
  <p class="note">Cada giro revela un resultado al azar. Los premios y condiciones de redención deben ser confirmados por KOVA antes de publicar la ruleta.</p>
</main>
<script>
const prizes = [
  "Descuento en sacos",
  "Descuento en tenis de hombre",
  "Descuento en tenis de mujer",
  "Descuento en guayos",
  "Descuento en camisetas",
  "Descuento en camibuzos",
  "Descuento en bermudas",
  "Descuento en pantalonetas",
  "Premio sorpresa: electrodoméstico",
  "Esta vez no ganaste"
];
const colors = ["#d9d4c8","#66705a","#b7aa96","#343a30","#eee9df","#7d806c","#a99b85","#4b5141","#c5b69e","#242424"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const cx=450,cy=450,r=425,step=Math.PI*2/prizes.length;
let rotation=0,busy=false;
function draw(){
  ctx.clearRect(0,0,900,900);
  prizes.forEach((p,i)=>{
    const start=rotation+i*step-Math.PI/2;
    const end=start+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=7;ctx.strokeStyle="#171717";ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(start+step/2);
    ctx.textAlign="right";ctx.fillStyle=(i===0||i===2||i===4||i===6||i===8)?"#171717":"#f8f5ee";
    ctx.font="bold 25px Arial";wrapText(p,310,0,185,29);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,82,0,Math.PI*2);ctx.fillStyle="#171717";ctx.fill();ctx.lineWidth=9;ctx.strokeStyle="#d9d4c8";ctx.stroke();
  ctx.fillStyle="#d9d4c8";ctx.textAlign="center";ctx.font="bold 34px Arial";ctx.fillText("KOVA",cx,cy+12);
}
function wrapText(text,x,y,maxWidth,lineHeight){
  const words=text.split(" ");let line="",lines=[];
  for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}
  lines.push(line);const offset=(lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y-offset+i*lineHeight));
}
draw();
document.getElementById("spin").addEventListener("click",()=>{
  if(busy)return;busy=true;
  const btn=document.getElementById("spin"),result=document.getElementById("result");
  btn.disabled=true;result.classList.remove("show");
  const winner=Math.floor(Math.random()*prizes.length);
  const target=-((winner+.5)*step);
  const current=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const normalized=((target-current)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const start=rotation,extra=8*Math.PI*2+normalized,duration=5200,begin=performance.now();
  function animate(now){
    const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,4);
    rotation=start+extra*ease;draw();
    if(t<1)requestAnimationFrame(animate);
    else{
      document.getElementById("prize").textContent=prizes[winner];
      result.classList.add("show");btn.disabled=false;busy=false;
    }
  }
  requestAnimationFrame(animate);
});
</script>
</body>
</html>
